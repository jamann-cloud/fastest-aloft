name: feed-check
on:
  push:
    paths: [".github/workflows/feed-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe feeds
        run: |
          O="https://jamann-cloud.github.io"
          for u in \
            "https://api.adsb.lol/v2/point/40.6/-73.8/50" \
            "https://opendata.adsb.fi/api/v2/lat/40.6/lon/-73.8/dist/50" \
            "https://opendata.adsb.fi/api/v2/hex/a835af" \
            "https://api.airplanes.live/v2/point/40.6/-73.8/50" \
            "https://api.airplanes.live/v2/mil" \
            "https://opensky-network.org/api/states/all?lamin=40&lomin=-75&lamax=41&lomax=-73" \
            "https://api.adsbdb.com/v0/callsign/BAW238" \
            "https://api.planespotters.net/pub/photos/hex/406a93" ; do
            H=$(curl -sS -m 20 -D - -o body.txt -H "Origin: $O" "$u" 2>&1 | grep -iE "^HTTP|access-control-allow-origin|curl:" | tr -d '\r' | tr '\n' ' ')
            B=$(head -c 140 body.txt 2>/dev/null | tr -d '\r\n')
            echo "::notice::$u => $H || $B"
            sleep 1
          done
