name: live-preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/preview.yml", "tools/preview.cjs"]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps webkit chromium >/dev/null
      - run: node tools/preview.cjs
      - name: Publish screenshots to the previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "preview-bot"; git config user.email "preview-bot@users.noreply.github.com"
          git add -A && git commit -qm "Preview $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previews
